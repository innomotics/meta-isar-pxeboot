BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
        ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-isar-pxeboot"
BBFILE_PATTERN_meta-isar-pxeboot = "^${LAYERDIR}/recipes-"
BBFILE_PRIORITY_meta-isar-pxeboot = "7"

LAYERSERIES_COMPAT_meta-isar-pxeboot = "next"

LAYERDIR_meta-isar-pxeboot = "${LAYERDIR}"
