PXESERVER_TMPDIR ?= "${TOPDIR}/tmp-${PXESERVER_MC}-${MACHINE}"
TMPDIR = "${PXESERVER_TMPDIR}"

DEPLOY_DIR_IMAGE .= "-${PXE_TARGET_MACHINE}"

# installer
PXESERVER_MC = "pxe-boot-server"

PXE_TARGET_MACHINE ?= "qemuamd64"
PXESERVER_LIVE_INSTALLER_MC ?= "pxe-boot-installer-target"
PXESERVER_LIVE_INSTALLER_MACHINE ?= "${PXE_TARGET_MACHINE}"
PXESERVER_LIVE_INSTALLER_IMAGE ?= "isar-image-installer"

PXESERVER_LIVE_INSTALLER_ADDITIONAL_KERNEL_CMDLINE:append:pxe-nfsroot = " root=/dev/nfs ro nfsroot=${PXESERVER_IP}:/var/installer/rootfs proto=tcp"
